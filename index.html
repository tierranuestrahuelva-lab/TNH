<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#830040">
<title>Guía de Vinos · Tierra Nuestra</title>
<meta name="description" content="Guía de vinos de la tienda Tierra Nuestra Huelva: precios, uvas, bodegas y D.O.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<body>

    <nav class="nav-pc" id="nav-pc"></nav>
  </div>

    <button type="button" class="ib" id="b-cam" aria-label="Escanear código de barras"></button>

</header>
<main id="main"></main>
<nav class="nav-mov" id="nav-mov"></nav>
<div id="sheet-root"></div>
